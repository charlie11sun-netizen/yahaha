# Production / deployable GameWeave stack.
#
# Differences vs the dev docker-compose.yml:
#   - production builds (frontend `next start`, api uvicorn without --reload, no source bind-mounts)
#   - public URLs are parameterised (PUBLIC_API_URL / PUBLIC_S3_URL / PUBLIC_WEB_URL) instead of localhost
#   - the whole site sits behind a password: SITE_PASSWORD is REQUIRED (compose errors if unset)
#   - only web (3000), api (8000) and the MinIO S3 port (9000) are published; Postgres/Redis/console stay internal
#
# Same `name:` as the dev stack => it reuses the SAME named volumes (pgdata/miniodata).
# On the SAME machine your existing games are already in those volumes (no migration needed).
# To move to a NEW host, run deploy/migrate-export.sh here and deploy/migrate-import.sh there first.
#
# Run:  docker compose -f docker-compose.prod.yml up -d --build
name: gameweave

services:
  postgres:
    image: pgvector/pgvector:0.8.2-pg16
    restart: unless-stopped
    mem_limit: 1g
    cpus: "1.0"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-gameweave}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set a strong POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-gameweave}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-gameweave}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    mem_limit: 256m
    cpus: "0.5"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio
    restart: unless-stopped
    mem_limit: 512m
    cpus: "0.5"
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set a strong MINIO_ROOT_PASSWORD in .env}
    ports:
      - "9000:9000"   # S3 API — browsers load game bundles from here (PUBLIC_S3_URL)
    volumes:
      - miniodata:/data

  # Create the bucket and make only the games prefix anonymously readable so the
  # sandboxed <iframe> can load bundles cross-origin (the site gate covers the
  # app + API; raw bundle URLs in object storage are UUID-obscured but public).
  createbuckets:
    image: minio/mc
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 ${MINIO_ROOT_USER:-minioadmin} ${MINIO_ROOT_PASSWORD:-minioadmin}; do echo 'waiting for minio...'; sleep 2; done;
      mc mb --ignore-existing local/${S3_BUCKET:-gameweave};
      mc anonymous set none local/${S3_BUCKET:-gameweave};
      mc anonymous set download local/${S3_BUCKET:-gameweave}/games;
      echo 'bucket ready';
      exit 0;
      "

  migrate:
    build: ./backend
    restart: "no"
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-gameweave}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-gameweave}
    command: alembic upgrade head
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build: ./backend
    restart: unless-stopped
    mem_limit: 512m
    cpus: "1.0"
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-gameweave}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-gameweave}
      # Schema is owned by the migrate service (alembic upgrade head); the dev
      # create_all fallback must stay off so missing migrations fail loudly.
      AUTO_CREATE_ALL: "false"
      REDIS_URL: redis://redis:6379/0
      S3_ENDPOINT: http://minio:9000
      # Public address browsers use to fetch game bundles. MUST be reachable from
      # the visitor's browser (server IP or domain), e.g. http://YOUR_HOST:9000
      S3_PUBLIC_ENDPOINT: ${PUBLIC_S3_URL:?set PUBLIC_S3_URL in .env}
      CORS_ORIGINS: ${PUBLIC_WEB_URL:?set PUBLIC_WEB_URL in .env}
      FRONTEND_BASE_URL: ${PUBLIC_WEB_URL}
      OAUTH_REDIRECT_BASE: ${PUBLIC_API_URL:?set PUBLIC_API_URL in .env}
      ENABLE_OAUTH_DEMO: "false"
      # SITE_PASSWORD comes from .env (env_file). Backend requires X-Gate-Token when set.
      SITE_PASSWORD: ${SITE_PASSWORD:?set SITE_PASSWORD in .env — site must not be public}
    command: sh -c "python -m app.seed && uvicorn app.main:app --host 0.0.0.0 --port 8000"
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      createbuckets:
        condition: service_completed_successfully
      migrate:
        condition: service_completed_successfully

  worker:
    build: ./backend
    restart: unless-stopped
    mem_limit: 1g
    cpus: "1.5"
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-gameweave}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-gameweave}
      AUTO_CREATE_ALL: "false"
      REDIS_URL: redis://redis:6379/0
      S3_ENDPOINT: http://minio:9000
      S3_PUBLIC_ENDPOINT: ${PUBLIC_S3_URL}
      SANDBOX_URL: http://sandbox:8001
      SANDBOX_REQUIRED: "true"
    command: celery -A app.tasks.celery_app.celery worker --loglevel=info --concurrency=2 --max-tasks-per-child=20
    networks:
      - default
      - sandbox_net
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      createbuckets:
        condition: service_completed_successfully
      migrate:
        condition: service_completed_successfully
      sandbox:
        condition: service_healthy

  beat:
    build: ./backend
    restart: unless-stopped
    mem_limit: 256m
    cpus: "0.5"
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-gameweave}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-gameweave}
      REDIS_URL: redis://redis:6379/0
    command: celery -A app.tasks.celery_app.celery beat --loglevel=info
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  sandbox:
    build: ./sandbox
    restart: unless-stopped
    # Set SANDBOX_RUNTIME=runsc after installing gVisor on the host. Use runc
    # when the deployment platform does not support custom runtimes.
    runtime: ${SANDBOX_RUNTIME:-runc}
    init: true
    read_only: true
    tmpfs:
      - /tmp
    mem_limit: 768m
    cpus: "1.0"
    pids_limit: 256
    security_opt:
      - no-new-privileges:true
    environment:
      SANDBOX_RUNNER_CONCURRENCY: "1"
      SANDBOX_RUNNER_CHROMIUM_NO_SANDBOX: ${SANDBOX_RUNNER_CHROMIUM_NO_SANDBOX:-true}
    networks:
      - sandbox_net
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health', timeout=2).read()"]
      interval: 10s
      timeout: 3s
      retries: 10

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
      args:
        # Baked into the client bundle at build time. Change it => rebuild `web`.
        NEXT_PUBLIC_API_BASE_URL: ${PUBLIC_API_URL:?set PUBLIC_API_URL in .env}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      # The front-door password. Read at runtime by middleware.ts; never exposed
      # to the client. Empty => site is OPEN, so it is required here.
      SITE_PASSWORD: ${SITE_PASSWORD:?set SITE_PASSWORD in .env — site must not be public}
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  pgdata:
  miniodata:

networks:
  sandbox_net:
    internal: true
