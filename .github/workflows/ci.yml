name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - run: pytest -q

  sandbox-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: docker build -t gameweave-sandbox ./sandbox
      - name: Start sandbox runner
        run: >
          docker run -d --name gameweave-sandbox
          --init
          --read-only
          --tmpfs /tmp
          --shm-size=1g
          --pids-limit=256
          --security-opt no-new-privileges:true
          -e HOME=/tmp
          -e XDG_CACHE_HOME=/tmp/.cache
          -e SANDBOX_RUNNER_CHROMIUM_NO_SANDBOX=true
          -p 8001:8001
          gameweave-sandbox
      - name: Wait for sandbox health
        run: |
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:8001/health; then exit 0; fi
            docker logs gameweave-sandbox || true
            sleep 2
          done
          docker logs gameweave-sandbox || true
          exit 1
      - run: pip install -r backend/requirements-dev.txt
      - run: SANDBOX_URL=http://127.0.0.1:8001 pytest backend/tests/test_sandbox_runner_integration.py -q

  frontend-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: npm ci
      - name: Audit production dependencies
        run: npm run audit
      - name: Install backend schema dependencies
        run: pip install -r ../backend/requirements.txt
      - name: Verify generated OpenAPI types
        run: npm run openapi:check
      - name: Lint frontend
        run: npm run lint
      - name: Typecheck frontend
        run: npm run typecheck
      - name: Build production frontend
        run: npm run build

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install Playwright tests
        working-directory: e2e
        run: npm ci
      - name: Install Chromium
        working-directory: e2e
        run: npx playwright install --with-deps chromium
      - name: Prepare Compose environment
        run: |
          touch .env
          docker compose config --quiet
      - name: Start stack
        run: docker compose up -d --build
      - name: Wait for API readiness
        run: |
          for i in {1..60}; do
            if curl -fsS http://127.0.0.1:8000/health/ready; then exit 0; fi
            docker compose logs --tail=80 api worker outbox-worker beat sandbox || true
            sleep 2
          done
          docker compose logs api worker outbox-worker beat sandbox || true
          exit 1
      - name: Run Playwright E2E
        working-directory: e2e
        env:
          E2E_BASE_URL: http://127.0.0.1:3000
          E2E_API_URL: http://127.0.0.1:8000
        run: npx playwright test
      - name: Upload Playwright artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-artifacts
          path: |
            e2e/playwright-report
            e2e/test-results
