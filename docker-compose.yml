name: gameweave

services:
  postgres:
    image: pgvector/pgvector:0.8.2-pg16
    mem_limit: 1g
    cpus: "1.0"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-gameweave}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-gameweave}
      POSTGRES_DB: ${POSTGRES_DB:-gameweave}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-gameweave}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    mem_limit: 256m
    cpus: "0.5"
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio
    mem_limit: 512m
    cpus: "0.5"
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # 控制台
    volumes:
      - miniodata:/data

  # 等 MinIO 就绪后建桶并放开 games 前缀的匿名只读（Play 远端加载用）
  createbuckets:
    image: minio/mc
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 ${MINIO_ROOT_USER:-minioadmin} ${MINIO_ROOT_PASSWORD:-minioadmin}; do echo 'waiting for minio...'; sleep 2; done;
      mc mb --ignore-existing local/${S3_BUCKET:-gameweave};
      mc anonymous set none local/${S3_BUCKET:-gameweave};
      mc anonymous set download local/${S3_BUCKET:-gameweave}/games;
      echo 'bucket ready';
      exit 0;
      "

  api:
    build: ./backend
    mem_limit: 512m
    cpus: "1.0"
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-gameweave}:${POSTGRES_PASSWORD:-gameweave}@postgres:5432/${POSTGRES_DB:-gameweave}
      REDIS_URL: redis://redis:6379/0
      S3_ENDPOINT: http://minio:9000
      S3_PUBLIC_ENDPOINT: http://localhost:9000
    command: sh -c "python -m app.seed && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      createbuckets:
        condition: service_completed_successfully

  worker:
    build: ./backend
    mem_limit: 1g
    cpus: "1.5"
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-gameweave}:${POSTGRES_PASSWORD:-gameweave}@postgres:5432/${POSTGRES_DB:-gameweave}
      REDIS_URL: redis://redis:6379/0
      S3_ENDPOINT: http://minio:9000
      S3_PUBLIC_ENDPOINT: http://localhost:9000
      SANDBOX_URL: http://sandbox:8001
      SANDBOX_REQUIRED: "true"
    command: celery -A app.tasks.celery_app.celery worker --loglevel=info --concurrency=2 --max-tasks-per-child=20
    volumes:
      - ./backend:/app
    networks:
      - default
      - sandbox_net
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      createbuckets:
        condition: service_completed_successfully
      sandbox:
        condition: service_healthy

  beat:
    build: ./backend
    mem_limit: 256m
    cpus: "0.5"
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-gameweave}:${POSTGRES_PASSWORD:-gameweave}@postgres:5432/${POSTGRES_DB:-gameweave}
      REDIS_URL: redis://redis:6379/0
    command: celery -A app.tasks.celery_app.celery beat --loglevel=info
    volumes:
      - ./backend:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  sandbox:
    build: ./sandbox
    init: true
    read_only: true
    shm_size: 1gb
    tmpfs:
      - /tmp
    mem_limit: 768m
    cpus: "1.0"
    pids_limit: 256
    security_opt:
      - no-new-privileges:true
    environment:
      HOME: /tmp
      XDG_CACHE_HOME: /tmp/.cache
      SANDBOX_RUNNER_CONCURRENCY: "1"
      SANDBOX_RUNNER_CHROMIUM_NO_SANDBOX: ${SANDBOX_RUNNER_CHROMIUM_NO_SANDBOX:-true}
    networks:
      - sandbox_net
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health', timeout=2).read()"]
      interval: 10s
      timeout: 3s
      retries: 10

  clamav:
    image: clamav/clamav:stable
    profiles: ["scan"]
    mem_limit: 1536m
    cpus: "1.0"
    healthcheck:
      test: ["CMD", "clamdscan", "--version"]
      interval: 30s
      timeout: 10s
      retries: 5

  web:
    build: ./frontend
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
      # 整站访问密码门禁。留空 = 不启用（本地开发默认开放）；
      # 部署时在 .env 里设好 SITE_PASSWORD，打开网站即需先输入此密码。
      SITE_PASSWORD: ${SITE_PASSWORD:-}
      # Bind mounts on Windows/Docker don't deliver inotify events; poll so HMR
      # detects host edits and never leaves .next half-compiled.
      WATCHPACK_POLLING: "true"
    command: npm run dev
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      # Keep build output on the container's own filesystem. Sharing .next with
      # the Windows host corrupts it and makes every /_next/static asset 404.
      - /app/node_modules
      - /app/.next
    depends_on:
      - api

volumes:
  pgdata:
  miniodata:

networks:
  sandbox_net:
    internal: true
