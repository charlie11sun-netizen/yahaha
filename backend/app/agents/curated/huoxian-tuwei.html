<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
  <title>火线突围</title>
  <style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#05070c;color:#eef8ff;font-family:"Segoe UI",system-ui,-apple-system,BlinkMacSystemFont,sans-serif;user-select:none;touch-action:none}
#game,canvas{position:absolute;inset:0;display:block}
.vignette{position:absolute;inset:0;z-index:2;pointer-events:none;background:radial-gradient(110% 95% at 50% 43%,rgba(0,0,0,0) 48%,rgba(1,3,10,.74) 100%)}
.damage{position:absolute;inset:0;z-index:4;pointer-events:none;opacity:0;background:radial-gradient(95% 85% at 50% 50%,rgba(255,42,62,0) 43%,rgba(255,24,42,.58) 100%);transition:opacity .18s}
.damage.on{opacity:1}
.hud{position:absolute;top:18px;left:0;right:0;z-index:5;padding:0 24px;display:flex;justify-content:space-between;align-items:flex-start;pointer-events:none;font-variant-numeric:tabular-nums;text-shadow:0 2px 12px rgba(0,0,0,.72)}
.panel{display:flex;gap:18px;align-items:flex-start;min-width:250px}
.panel.right{justify-content:flex-end}
.stat{padding:12px 14px;border:1px solid rgba(105,238,255,.15);border-radius:18px;background:linear-gradient(180deg,rgba(9,18,28,.58),rgba(5,8,14,.24));box-shadow:0 12px 34px rgba(0,0,0,.25),inset 0 0 24px rgba(89,229,255,.035);backdrop-filter:blur(4px);display:flex;flex-direction:column;gap:2px}
.align-right{align-items:flex-end}
.label{font-size:10px;font-weight:900;letter-spacing:.22em;text-transform:uppercase;color:rgba(222,247,255,.48)}
.value{font-size:31px;line-height:1;font-weight:900;color:#f4fbff}
.value.small{font-size:25px}
.combo{font-size:13px;font-weight:900;color:#ffe26d;opacity:0;transition:.18s}
.combo.on{opacity:1;text-shadow:0 0 16px rgba(255,226,109,.65)}
.bars{padding:12px 14px;border:1px solid rgba(105,238,255,.15);border-radius:18px;background:linear-gradient(180deg,rgba(9,18,28,.58),rgba(5,8,14,.24));min-width:168px}
.hp,.armor{display:flex;gap:5px;margin-top:8px;justify-content:flex-end}
.hp i,.armor i{display:block;width:15px;height:8px;border-radius:999px;background:linear-gradient(90deg,#75f4ff,#42bfff);box-shadow:0 0 13px rgba(80,226,255,.8);transition:.2s}
.hp i.gone,.armor i.gone{opacity:.13;background:#2d3446;box-shadow:none;transform:scaleX(.58)}
.armor i{height:5px;background:linear-gradient(90deg,#88a7ff,#57e8ff);box-shadow:0 0 10px rgba(89,229,255,.6)}
.reticle{position:absolute;left:50%;top:50%;width:42px;height:42px;margin:-21px 0 0 -21px;filter:drop-shadow(0 0 12px #59e5ff);opacity:.9}
.reticle:before,.reticle:after,.reticle i,.reticle b{content:"";position:absolute;background:#6ff2ff;border-radius:999px}
.reticle:before{left:19px;top:0;width:4px;height:12px}.reticle:after{left:19px;bottom:0;width:4px;height:12px}
.reticle i{top:19px;left:0;width:12px;height:4px}.reticle b{top:19px;right:0;width:12px;height:4px}
.reticle{border:1px solid rgba(111,242,255,.22);border-radius:50%}
.hint{position:absolute;bottom:17px;left:0;right:0;z-index:5;text-align:center;pointer-events:none;font-size:12px;letter-spacing:.03em;color:rgba(238,248,255,.55);text-shadow:0 2px 10px #000}
.hint b{color:#87f6ff}
.banner{position:absolute;left:50%;top:22%;z-index:6;transform:translate(-50%,-20px);opacity:0;pointer-events:none;font-size:34px;font-weight:950;letter-spacing:.16em;text-transform:uppercase;color:#ecfdff;text-shadow:0 0 28px rgba(89,229,255,.8);transition:opacity .35s,transform .35s}
.banner.show{opacity:1;transform:translate(-50%,0)}
.veil{position:absolute;inset:0;z-index:10;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:18px;text-align:center;padding:30px;background:radial-gradient(115% 100% at 50% 39%,rgba(10,24,36,.62),rgba(2,4,10,.96));backdrop-filter:blur(5px)}
.veil.hide{display:none}
.tag{font-size:12px;font-weight:900;letter-spacing:.26em;text-transform:uppercase;color:rgba(233,250,255,.48)}
.veil h1{font-size:clamp(44px,8vw,76px);line-height:.95;font-weight:1000;letter-spacing:-.04em;background:linear-gradient(95deg,#71f2ff,#7a9cff 48%,#ff5fae);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;text-shadow:0 0 48px rgba(89,229,255,.38)}
.veil p{max-width:580px;font-size:15px;line-height:1.72;color:rgba(237,248,255,.72)}
.pill{border:0;cursor:pointer;margin-top:4px;padding:14px 32px;border-radius:999px;background:linear-gradient(95deg,#6ff2ff,#728dff);color:#041018;font-size:15px;font-weight:950;letter-spacing:.05em;box-shadow:0 14px 42px rgba(90,220,255,.34);animation:bob 1.9s ease-in-out infinite}
.pill:hover{filter:brightness(1.08)}
.final{font-size:68px;line-height:1;font-weight:1000;color:#92f7ff;text-shadow:0 0 42px rgba(89,229,255,.7)}
.keys{display:flex;gap:20px;flex-wrap:wrap;justify-content:center;font-size:12px;color:rgba(238,248,255,.52)}
.keys b{color:#8df6ff}
@keyframes bob{50%{transform:translateY(-3px)}}
@media(max-width:720px){.hud{padding:0 12px}.panel{gap:8px;min-width:0}.stat,.bars{padding:10px}.value{font-size:24px}.hint{font-size:11px;padding:0 14px}.reticle{display:none}}
</style>
</head>
<body>
  <div id="game"></div>
  <div class="vignette"></div>
  <div class="damage" id="damage"></div>

  <div class="hud" id="hud">
    <div class="panel left">
      <div class="stat">
        <span class="label">Score</span>
        <span class="value" id="score">0</span>
        <span class="combo" id="combo">x1.00</span>
      </div>
      <div class="stat">
        <span class="label">Wave</span>
        <span class="value small" id="wave">1/9</span>
      </div>
    </div>

    <div class="reticle" id="reticle"><i></i><b></b></div>

    <div class="panel right">
      <div class="stat align-right">
        <span class="label">Time</span>
        <span class="value small" id="time">00:00</span>
      </div>
      <div class="stat align-right">
        <span class="label">Ammo</span>
        <span class="value small" id="ammo">18/18</span>
      </div>
      <div class="bars">
        <span class="label">Vitals</span>
        <div class="hp" id="hp"></div>
        <div class="armor" id="armor"></div>
      </div>
    </div>
  </div>

  <div class="banner" id="banner">WAVE 1</div>

  <div class="hint">
    <b>WASD</b> 移动 · <b>鼠标</b> 瞄准 · <b>左键/空格</b> 射击 · <b>R</b> 换弹 · <b>Shift</b> 冲刺 · <b>E</b> 拾取
  </div>

  <div class="veil" id="start">
    <span class="tag">Neon street combat</span>
    <h1>火线突围</h1>
    <p>在废弃仓库街区中利用掩体压制敌人，拾取补给升级武器，坚持到最终波次并击败 Iron Gate Captain。</p>
    <button class="pill" id="startBtn">点击开始突围</button>
    <div class="keys"><span><b>Move</b> WASD / 方向键</span><span><b>Aim</b> Mouse</span><span><b>Fire</b> Click / Space</span></div>
  </div>

  <div class="veil hide" id="over">
    <span class="tag" id="overTag">Mission ended</span>
    <h1 id="overTitle">突围失败</h1>
    <div class="final" id="finalScore">0</div>
    <p id="overText">你倒在了火线中。</p>
    <button class="pill" id="restartBtn">重新部署</button>
  </div>

  <script src="three.min.js"></script>
  <script>
"use strict";
(function(){
if(!window.THREE){document.getElementById("start").innerHTML="<h1>THREE unavailable</h1>";return;}
var T=window.THREE;

/* ---------- constants declared before use ---------- */
var ARENA={x:36,z:24};
var ACCENT=0x59e5ff;
var MAX_HP=120;
var WAVE_DEFS=[
 {name:"Wave 1 · Alley Contact",delay:2,list:["gun","gun"],bonus:250},
 {name:"Wave 2 · Crossfire",delay:7,list:["gun","gun","gun","gun","runner"],bonus:320},
 {name:"Wave 3 · Flank Drill",delay:8,list:["gun","gun","gun","gun","gun","runner","runner"],bonus:420},
 {name:"Wave 4 · Armor Push",delay:8,list:["gun","gun","gun","shield","shield","shotgun"],bonus:520},
 {name:"Wave 5 · Grenade Rain",delay:8,list:["gun","gun","gun","gun","runner","runner","shotgun","shotgun","grenadier"],bonus:650},
 {name:"Wave 6 · Marksman Line",delay:9,list:["shield","shield","grenadier","grenadier","gun","gun","gun","marksman"],bonus:780},
 {name:"Wave 7 · Collapse",delay:9,list:["gun","gun","gun","runner","runner","shotgun","grenadier","marksman"],bonus:900},
 {name:"Wave 8 · Elite Assault",delay:10,list:["shield","shield","shotgun","shotgun","grenadier","grenadier","marksman","marksman"],bonus:1100},
 {name:"Final Wave · Iron Gate Captain",delay:10,list:["boss","gun","gun","gun","gun"],bonus:0}
];
var TYPES={
 gun:{hp:45,spd:3,score:100,range:17,fire:1.75,mat:0x9b3b2f},
 runner:{hp:35,spd:5.6,score:120,range:1.8,fire:1.35,mat:0xff7a27},
 shield:{hp:120,spd:2.1,score:220,range:15,fire:1.45,mat:0x6b1e22},
 shotgun:{hp:90,spd:2.8,score:180,range:8,fire:2.45,mat:0x7a263c},
 grenadier:{hp:70,spd:2.35,score:240,range:21,fire:3.3,mat:0x2e7b4f},
 marksman:{hp:95,spd:2.6,score:300,range:23,fire:3.0,mat:0x11131a},
 boss:{hp:1600,spd:1.65,score:1000,range:19,fire:1.1,mat:0x17191f}
};
var WEAPONS=[
 {name:"Carbine",mag:18,rate:.18,dmg:18,spread:.035,pierce:0,color:0x6ff2ff},
 {name:"Burst",mag:24,rate:.135,dmg:19,spread:.045,pierce:0,color:0x80f7ff},
 {name:"Twin",mag:30,rate:.105,dmg:21,spread:.06,pierce:0,color:0xb47cff},
 {name:"Rail",mag:34,rate:.09,dmg:25,spread:.02,pierce:1,color:0xffc65c}
];
var PICKUPS=["med","armor","ammo","kit","adrenaline","pierce","drone","cache"];
var SPAWNS=[new T.Vector3(0,0,-23),new T.Vector3(0,0,23),new T.Vector3(-35,0,0),new T.Vector3(35,0,0),new T.Vector3(-30,0,-18),new T.Vector3(30,0,-18),new T.Vector3(-30,0,18),new T.Vector3(30,0,18)];
var key={},mouse={x:0,y:0,down:false},clock=new T.Clock();
var renderer,scene,camera,raycaster,groundPlane;
var player,playerBody,rifle,footRing,aimPoint=new T.Vector3(0,0,0);
var bullets=[],enemyBullets=[],enemies=[],obstacles=[],pickups=[],particles=[],floaters=[],grenades=[];
var state="ready",elapsed=0,score=0,wave=0,nextWaveTimer=0,waveActive=false,kills=0,comboKills=0,comboMult=1,comboTimer=0,comboProtect=0;
var hp=MAX_HP,armor=0,weaponLv=0,ammo=WEAPONS[0].mag,reloadT=0,fireCd=0,dashCd=0,dashT=0,invuln=0,shake=0,slowMo=0;
var buffs={adrenaline:0,pierce:0,ammo:0,drone:0,focus:0};
var sentScore=false;
var ui={
 score:document.getElementById("score"),wave:document.getElementById("wave"),time:document.getElementById("time"),
 ammo:document.getElementById("ammo"),hp:document.getElementById("hp"),armor:document.getElementById("armor"),
 combo:document.getElementById("combo"),banner:document.getElementById("banner"),damage:document.getElementById("damage"),
 start:document.getElementById("start"),over:document.getElementById("over"),finalScore:document.getElementById("finalScore"),
 overTitle:document.getElementById("overTitle"),overTag:document.getElementById("overTag"),overText:document.getElementById("overText")
};
var AC=window.AudioContext||window.webkitAudioContext,ac=AC?new AC():null;

/* ---------- utility ---------- */
function rnd(a,b){return a+Math.random()*(b-a)}
function clamp(v,a,b){return Math.max(a,Math.min(b,v))}
function dist2(a,b){var dx=a.x-b.x,dz=a.z-b.z;return Math.sqrt(dx*dx+dz*dz)}
function el(id){return document.getElementById(id)}
function snd(f,d,type,vol){if(!ac)return;if(ac.state==="suspended")ac.resume();var o=ac.createOscillator(),g=ac.createGain(),t=ac.currentTime;o.type=type||"sine";o.frequency.setValueAtTime(f,t);o.frequency.exponentialRampToValueAtTime(Math.max(40,f*.55),t+d);g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(vol||.08,t+.01);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g);g.connect(ac.destination);o.start(t);o.stop(t+d+.03)}
function mat(c,e,ei){return new T.MeshStandardMaterial({color:c,emissive:e||0x000000,emissiveIntensity:ei||0,roughness:.68,metalness:.12})}
function makeCapsule(color){var g=new T.Group(),m=mat(color,color,.08),c=new T.Mesh(new T.CylinderGeometry(.42,.42,1.15,16),m),h=new T.Mesh(new T.SphereGeometry(.43,16,10),m),b=new T.Mesh(new T.SphereGeometry(.43,16,10),m);c.position.y=1.0;h.position.y=1.58;b.position.y=.42;g.add(c,h,b);return g}
function lookXZ(obj,target){var dx=target.x-obj.position.x,dz=target.z-obj.position.z;obj.rotation.y=Math.atan2(dx,dz)}
function showBanner(txt){ui.banner.textContent=txt;ui.banner.classList.add("show");setTimeout(function(){ui.banner.classList.remove("show")},1550)}
function flashDamage(){ui.damage.classList.add("on");setTimeout(function(){ui.damage.classList.remove("on")},90)}
function addFloat(txt,pos,col){var d=document.createElement("div");d.textContent=txt;d.style.cssText="position:absolute;z-index:8;pointer-events:none;font-weight:900;color:#"+col.toString(16).padStart(6,"0")+";text-shadow:0 0 12px #000;font-size:16px";document.body.appendChild(d);floaters.push({el:d,pos:pos.clone(),life:1});}
function worldToScreen(p){var v=p.clone().project(camera);return {x:(v.x*.5+.5)*innerWidth,y:(-.5*v.y+.5)*innerHeight}}
function burst(pos,color,n,scale){for(var i=0;i<n;i++){var mesh=new T.Mesh(new T.BoxGeometry(.12*scale,.12*scale,.12*scale),new T.MeshBasicMaterial({color:color,transparent:true,opacity:1,blending:T.AdditiveBlending,depthWrite:false}));mesh.position.copy(pos);scene.add(mesh);particles.push({m:mesh,v:new T.Vector3(rnd(-1,1),rnd(.2,1.8),rnd(-1,1)).normalize().multiplyScalar(rnd(3,8)*scale),life:rnd(.35,.8),max:.8,spin:rnd(-8,8)});}}
function tracer(a,b,color){var geo=new T.BufferGeometry().setFromPoints([a,b]);var line=new T.Line(geo,new T.LineBasicMaterial({color:color,transparent:true,opacity:.9,blending:T.AdditiveBlending}));scene.add(line);particles.push({m:line,v:new T.Vector3(),life:.08,max:.08,line:true});}

/* ---------- scene ---------- */
function init(){
 renderer=new T.WebGLRenderer({antialias:true});
 renderer.setPixelRatio(Math.min(2,devicePixelRatio||1));renderer.setSize(innerWidth,innerHeight);renderer.shadowMap.enabled=true;
 document.getElementById("game").appendChild(renderer.domElement);
 scene=new T.Scene();scene.background=new T.Color(0x070b12);scene.fog=new T.FogExp2(0x2b3038,.032);
 camera=new T.PerspectiveCamera(58,innerWidth/innerHeight,.1,220);
 raycaster=new T.Raycaster();groundPlane=new T.Plane(new T.Vector3(0,1,0),0);
 scene.add(new T.HemisphereLight(0xb8d8ff,0x101018,.78));
 var sun=new T.DirectionalLight(0xffd2a0,1.45);sun.position.set(-12,26,12);sun.castShadow=true;sun.shadow.mapSize.set(1024,1024);scene.add(sun);
 scene.add(new T.AmbientLight(0x1a2940,.38));
 buildWorld();buildPlayer();resetUI();
 addEventListener("resize",onResize);
 bindInput();
 requestAnimationFrame(loop);
}
function buildWorld(){
 var ground=new T.Mesh(new T.PlaneGeometry(72,48,1,1),mat(0x1b2025,0x05080a,.05));ground.rotation.x=-Math.PI/2;ground.receiveShadow=true;scene.add(ground);
 for(var i=-30;i<=30;i+=10){var l=new T.Mesh(new T.BoxGeometry(.18,.025,44),mat(0x46505a,0x111111,.05));l.position.set(i,.02,0);scene.add(l)}
 for(var z=-18;z<=18;z+=12){var y=new T.Mesh(new T.BoxGeometry(68,.03,.16),mat(0xd5a62e,0x2d1a00,.25));y.position.set(0,.035,z);scene.add(y)}
 var sky=new T.Mesh(new T.SphereGeometry(115,24,12),new T.MeshBasicMaterial({color:0x0a101a,side:T.BackSide}));scene.add(sky);
 addWall(0,-4,2,16,9999,"wall");addWall(0,8,18,2,9999,"wall");
 addSand(-7,12);addSand(7,12);addSand(-9,3);addSand(9,-10);
 addCrates(-25,-15);addCrates(24,-14);addCrates(-25,15);addCrates(24,15);addCrates(4,1);
 addBarrier(-18,-2,7,1.2,.55);addBarrier(17,4,7,1.2,-.55);addBarrier(-13,-17,8,1.1,.25);addBarrier(13,18,8,1.1,-.25);
 addCar(-22,2);addCar(22,-4);
 for(var p=0;p<4;p++){var lamp=new T.PointLight(0xff3b4c,.75,12,2);lamp.position.copy(SPAWNS[p]).y=4;scene.add(lamp)}
}
function obstacleMesh(o,mesh){mesh.castShadow=true;mesh.receiveShadow=true;scene.add(mesh);o.mesh=mesh;obstacles.push(o);return o}
function addWall(x,z,w,d,hp,type){var mesh=new T.Mesh(new T.BoxGeometry(w,2.4,d),mat(0x30353a,0x08090a,.02));mesh.position.set(x,1.2,z);obstacleMesh({x:x,z:z,w:w,d:d,hp:hp,max:hp,type:type||"wall",solid:true},mesh)}
function addBarrier(x,z,w,d,rot){var g=new T.Group(),base=new T.Mesh(new T.BoxGeometry(w,1.0,d),mat(0x8b8f91,0x0a0a0a,.02));base.position.y=.5;g.add(base);for(var i=-1;i<=1;i+=2){var s=new T.Mesh(new T.BoxGeometry(w*.28,.08,.08),mat(0xffd43b,0x3b2b00,.35));s.position.set(i*w*.23,1.04,0);g.add(s)}g.position.set(x,0,z);g.rotation.y=rot;obstacleMesh({x:x,z:z,w:w,d:d,hp:9999,max:9999,type:"barrier",solid:true,rot:rot},g)}
function addSand(x,z){var g=new T.Group();for(var r=0;r<2;r++)for(var i=0;i<5;i++){var b=new T.Mesh(new T.CapsuleGeometry?new T.CapsuleGeometry(.23,.55,4,8):new T.SphereGeometry(.36,10,8),mat(0xb9965b,0x1a1105,.02));b.scale.set(1.55,.45,.72);b.position.set((i-2)*.72,.28+r*.42,(r-.5)*.55);g.add(b)}g.position.set(x,0,z);obstacleMesh({x:x,z:z,w:4.2,d:1.4,hp:180,max:180,type:"sand",solid:true,low:true},g)}
function addCrates(x,z){var g=new T.Group();for(var i=0;i<3;i++)for(var j=0;j<2;j++){var c=new T.Mesh(new T.BoxGeometry(1.35,1.35,1.35),mat((i+j)%2?0x1e5791:0xb76422,0x080808,.02));c.position.set((i-1)*1.42,.68+j*1.36,0);g.add(c);var bar=new T.Mesh(new T.BoxGeometry(1.48,.08,.08),mat(0x111111));bar.position.set((i-1)*1.42,1.34+j*1.36,.7);g.add(bar)}g.position.set(x,0,z);obstacleMesh({x:x,z:z,w:4.6,d:1.8,hp:150,max:150,type:"crate",solid:true},g)}
function addCar(x,z){var g=new T.Group(),body=new T.Mesh(new T.BoxGeometry(5.1,.85,2.25),mat(0x161719,0x1a0502,.05));body.position.y=.55;g.add(body);var top=new T.Mesh(new T.BoxGeometry(2.3,.75,1.7),mat(0x08090a));top.position.set(-.2,1.25,0);g.add(top);for(var i=-1;i<=1;i+=2)for(var j=-1;j<=1;j+=2){var wh=new T.Mesh(new T.CylinderGeometry(.42,.42,.35,16),mat(0x050505));wh.rotation.z=Math.PI/2;wh.position.set(i*1.75,.3,j*1.12);g.add(wh)}var l1=new T.Mesh(new T.CylinderGeometry(.12,.12,.8,8),mat(0x223dff,0x1d63ff,.7));l1.rotation.z=Math.PI/2;l1.position.set(.2,1.72,-.25);g.add(l1);var l2=l1.clone();l2.material=mat(0xff2538,0xff2538,.8);l2.position.z=.25;g.add(l2);g.position.set(x,0,z);obstacleMesh({x:x,z:z,w:5.4,d:2.6,hp:220,max:220,type:"car",solid:true,fire:0,exploded:false},g)}
function buildPlayer(){
 player=new T.Group();player.position.set(0,0,17);
 playerBody=makeCapsule(0x173b64);player.add(playerBody);
 var visor=new T.Mesh(new T.BoxGeometry(.55,.16,.08),mat(0x02080c,ACCENT,.3));visor.position.set(0,1.65,.39);playerBody.add(visor);
 rifle=new T.Group();var rb=new T.Mesh(new T.BoxGeometry(.22,.18,1.15),mat(0x05070a));rb.position.set(.42,1.18,.55);rifle.add(rb);var muz=new T.Mesh(new T.CylinderGeometry(.08,.08,.3,10),mat(0x070707,ACCENT,.25));muz.rotation.x=Math.PI/2;muz.position.set(.42,1.18,1.2);rifle.add(muz);player.add(rifle);
 footRing=new T.Mesh(new T.TorusGeometry(.72,.035,8,48),new T.MeshBasicMaterial({color:ACCENT,transparent:true,opacity:.85,blending:T.AdditiveBlending}));footRing.rotation.x=Math.PI/2;footRing.position.y=.04;player.add(footRing);
 scene.add(player);
}

/* ---------- game lifecycle ---------- */
function resetGame(){
 elapsed=0;score=0;wave=0;nextWaveTimer=2;waveActive=false;kills=0;comboKills=0;comboMult=1;comboTimer=0;comboProtect=0;
 hp=MAX_HP;armor=0;weaponLv=0;ammo=WEAPONS[0].mag;reloadT=0;fireCd=0;dashCd=0;dashT=0;invuln=0;shake=0;slowMo=0;sentScore=false;
 buffs={adrenaline:0,pierce:0,ammo:0,drone:0,focus:0};
 player.position.set(0,0,17);
 clearList(bullets);clearList(enemyBullets);clearEnemies();clearList(pickups);clearList(particles);clearList(grenades);
 for(var i=0;i<obstacles.length;i++){obstacles[i].hp=obstacles[i].max;obstacles[i].fire=0;obstacles[i].exploded=false;obstacles[i].mesh.visible=true;obstacles[i].mesh.scale.set(1,1,1)}
 spawnPickup("med",new T.Vector3(-3,0,14));spawnPickup("ammo",new T.Vector3(3,0,14));
 resetUI();showBanner("WAVE 1 · HOLD COVER");
}
function clearList(a){for(var i=a.length-1;i>=0;i--){if(a[i].m)scene.remove(a[i].m);if(a[i].mesh)scene.remove(a[i].mesh);a.splice(i,1)}}
function clearEnemies(){for(var i=enemies.length-1;i>=0;i--){scene.remove(enemies[i].mesh);enemies.splice(i,1)}}
function startGame(){if(ac&&ac.state==="suspended")ac.resume();ui.start.classList.add("hide");ui.over.classList.add("hide");resetGame();state="play";snd(520,.18,"triangle",.12)}
function gameOver(win){
 state="over";ui.over.classList.remove("hide");ui.finalScore.textContent=score|0;
 ui.overTitle.textContent=win?"突围成功":"突围失败";ui.overTag.textContent=win?"Mission complete":"Mission failed";
 ui.overText.textContent=win?"Iron Gate Captain 已被击溃，街区重新归于寂静。":"你倒在了火线中，但下一次部署会更锋利。";
 if(!sentScore){sentScore=true;try{window.parent.postMessage({type:"playforge:score",points:score|0,name:"火线突围"},"*")}catch(e){}}
 snd(win?760:110,win?.55:.55,win?"triangle":"sawtooth",.18);
}
function resetUI(){
 drawPips(ui.hp,12,12);drawPips(ui.armor,5,0);ui.score.textContent="0";ui.wave.textContent="1/9";ui.time.textContent="00:00";ui.ammo.textContent=ammo+"/"+WEAPONS[weaponLv].mag;ui.combo.classList.remove("on")
}
function drawPips(node,total,filled){var h="";for(var i=0;i<total;i++)h+='<i class="'+(i<filled?"":"gone")+'"></i>';node.innerHTML=h}
function updateHud(){
 ui.score.textContent=score|0;ui.wave.textContent=clamp(wave+1,1,9)+"/9";
 var m=Math.floor(elapsed/60),s=Math.floor(elapsed%60);ui.time.textContent=(m<10?"0":"")+m+":"+(s<10?"0":"")+s;
 ui.ammo.textContent=(reloadT>0?"RLD ":ammo)+"/"+WEAPONS[weaponLv].mag;
 drawPips(ui.hp,12,Math.ceil(hp/MAX_HP*12));drawPips(ui.armor,5,Math.ceil(armor/40*5));
 if(comboMult>1){ui.combo.textContent="x"+comboMult.toFixed(2);ui.combo.classList.add("on")}else ui.combo.classList.remove("on");
}

/* ---------- spawning ---------- */
function spawnWave(){
 if(wave>=WAVE_DEFS.length)return;
 var def=WAVE_DEFS[wave];waveActive=true;showBanner(def.name);snd(260+wave*35,.16,"sawtooth",.1);
 for(var i=0;i<def.list.length;i++)(function(type,idx){setTimeout(function(){if(state==="play")spawnEnemy(type,idx)},idx*(wave>=7?900:520));})(def.list[i],i);
 if(wave===6){spawnPickup("armor",new T.Vector3(-5,0,-2));spawnPickup("ammo",new T.Vector3(5,0,-2))}
 if(wave===7&&weaponLv<3)spawnPickup("kit",new T.Vector3(0,0,0));
}
function spawnEnemy(type,idx){
 var spec=TYPES[type],sp=SPAWNS[(idx+wave)%SPAWNS.length].clone();
 if(type==="boss")sp.set(0,0,-23);
 var mesh= type==="boss"?makeBoss():makeEnemyMesh(type);
 mesh.position.copy(sp);scene.add(mesh);
 enemies.push({type:type,mesh:mesh,hp:spec.hp,max:spec.hp,fire:rnd(.4,1.5),score:spec.score,aim:0,hitDuringAim:0,phase:0,melee:0,spawned:0});
}
function makeEnemyMesh(type){
 var g=makeCapsule(TYPES[type].mat);
 var gun=new T.Mesh(new T.BoxGeometry(.18,.18,.8),mat(0x090909));gun.position.set(.45,1.08,.45);g.add(gun);
 if(type==="shield"){var sh=new T.Mesh(new T.BoxGeometry(1.0,1.25,.18),mat(0x15191f,0x091018,.1));sh.position.set(0,1.05,.62);g.add(sh)}
 if(type==="shotgun"){var a=new T.Mesh(new T.BoxGeometry(.9,.22,.18),mat(0x2b1418));a.position.set(0,1.42,.05);g.add(a)}
 if(type==="grenadier"){var bp=new T.Mesh(new T.CylinderGeometry(.28,.28,.7,12),mat(0x162c1b));bp.rotation.x=Math.PI/2;bp.position.set(0,1.2,-.44);g.add(bp)}
 if(type==="marksman"){var rf=new T.Mesh(new T.CylinderGeometry(.045,.045,1.55,10),mat(0xc5cdd5,0x111111,.05));rf.rotation.x=Math.PI/2;rf.position.set(.45,1.2,.8);g.add(rf)}
 var mark=new T.Mesh(new T.ConeGeometry(.25,.35,3),new T.MeshBasicMaterial({color:0xff3148}));mark.position.y=2.35;mark.rotation.x=Math.PI;g.add(mark);
 return g;
}
function makeBoss(){
 var g=new T.Group(),core=makeCapsule(0x111319);core.scale.set(1.55,1.7,1.55);g.add(core);
 var chest=new T.Mesh(new T.BoxGeometry(1.7,1.2,.45),mat(0x262a30,0xff1b28,.12));chest.position.set(0,2.0,.55);g.add(chest);
 for(var i=-1;i<=1;i+=2){var can=new T.Mesh(new T.CylinderGeometry(.18,.18,1.25,14),mat(0x090909,0xff5a20,.12));can.rotation.x=Math.PI/2;can.position.set(i*.8,2.75,.45);g.add(can);var sh=new T.Mesh(new T.BoxGeometry(.25,1.7,1.1),mat(0x15181d,0x240000,.08));sh.position.set(i*1.15,1.65,.18);g.add(sh)}
 var tor=new T.Mesh(new T.TorusGeometry(.55,.12,10,32),mat(0x34383f,0xff4a1a,.15));tor.position.set(0,2.28,-.65);g.add(tor);
 return g;
}

/* ---------- combat ---------- */
function shoot(){
 if(reloadT>0||fireCd>0)return;
 var w=WEAPONS[weaponLv];if(ammo<=0){snd(130,.08,"square",.08);reload();return}
 ammo--;fireCd=w.rate/(buffs.focus>0?1.15:1)/(buffs.adrenaline>0?1.12:1);
 var muzzle=player.position.clone().add(new T.Vector3(Math.sin(player.rotation.y)*.8,1.18,Math.cos(player.rotation.y)*.8));
 var dir=new T.Vector3(aimPoint.x-player.position.x,0,aimPoint.z-player.position.z).normalize();
 var angle=Math.atan2(dir.x,dir.z)+rnd(-w.spread,w.spread);
 dir.set(Math.sin(angle),0,Math.cos(angle));
 var bmesh=new T.Mesh(new T.SphereGeometry(.08,8,8),new T.MeshBasicMaterial({color:(buffs.pierce>0?0xffbf55:w.color)}));
 bmesh.position.copy(muzzle);scene.add(bmesh);
 bullets.push({m:bmesh,dir:dir,spd:42,life:.72,dmg:w.dmg*(buffs.pierce>0?1.2:1),pierce:w.pierce+(buffs.pierce>0?1:0)});
 tracer(muzzle,muzzle.clone().add(dir.clone().multiplyScalar(5)),buffs.pierce>0?0xffbf55:w.color);
 burst(muzzle,w.color,3,.55);shake=Math.max(shake,.035);snd(620,.045,"square",.035);
}
function reload(){var w=WEAPONS[weaponLv];if(ammo>=w.mag||reloadT>0)return;reloadT=.9/(buffs.adrenaline>0?1.4:1);snd(260,.08,"triangle",.06)}
function enemyShoot(e){
 var pos=e.mesh.position.clone();var to=new T.Vector3(player.position.x-pos.x,0,player.position.z-pos.z);var d=to.length();if(d<.1)return;to.normalize();
 if(e.type==="runner"){if(d<2.1&&e.melee<=0){damagePlayer(18);e.melee=.9;burst(player.position.clone().setY(1),0xff512f,8,.8)}return}
 if(e.type==="grenadier"){spawnGrenade(pos,to);e.fire=TYPES[e.type].fire;return}
 if(e.type==="marksman"){e.aim=1.1;e.hitDuringAim=0;return}
 if(e.type==="shotgun"){for(var k=-3;k<=3;k++)spawnEnemyBullet(pos,to,k*.1,18,18,0xffc34a);e.fire=TYPES[e.type].fire;return}
 if(e.type==="boss"){var phase=e.hp/e.max<.35?3:e.hp/e.max<.7?2:1;if(Math.random()<.2)bossMortar(e);else for(var i=-1;i<=1;i+=2)spawnEnemyBullet(pos,to,i*.12,20,14,0xff6a20);e.fire=phase===3?.75:1.05;return}
 spawnEnemyBullet(pos,to,rnd(-.08,.08),e.type==="shield"?14:10,20,0xffd34a);e.fire=TYPES[e.type].fire;
}
function spawnEnemyBullet(pos,dir,ang,dmg,spd,col){
 var a=Math.atan2(dir.x,dir.z)+ang;dir=new T.Vector3(Math.sin(a),0,Math.cos(a));
 var m=new T.Mesh(new T.SphereGeometry(.09,8,8),new T.MeshBasicMaterial({color:col||0xffc44a}));
 m.position.copy(pos).y=1.05;scene.add(m);enemyBullets.push({m:m,dir:dir,spd:spd||18,life:3,dmg:dmg||10});
 tracer(m.position,m.position.clone().add(dir.clone().multiplyScalar(4)),col||0xffc44a);
}
function spawnGrenade(pos,dir){
 var target=player.position.clone().add(new T.Vector3(rnd(-2.2,2.2),0,rnd(-2.2,2.2)));
 var ring=new T.Mesh(new T.TorusGeometry(2,.035,8,48),new T.MeshBasicMaterial({color:0xff2338,transparent:true,opacity:.72}));
 ring.rotation.x=Math.PI/2;ring.position.set(target.x,.04,target.z);scene.add(ring);
 grenades.push({mesh:ring,pos:target,t:1.2,dmg:45,r:4});
 snd(180,.1,"sawtooth",.055);
}
function bossMortar(e){for(var i=0;i<5;i++)setTimeout(function(){if(state==="play")spawnGrenade(e.mesh.position,new T.Vector3())},i*180);e.fire=2.7}
function damagePlayer(amount){
 if(invuln>0)return;
 var dmg=amount;if(dashT>0)dmg*=.35;
 if(armor>0){var absorb=Math.min(armor,dmg*.6);armor-=absorb;dmg-=absorb}
 hp-=dmg;comboKills=0;if(comboProtect>0){comboProtect=0}else{comboMult=1}
 invuln=.18;shake=Math.max(shake,.25);flashDamage();snd(120,.22,"sawtooth",.14);
 if(hp<=0){hp=0;gameOver(false)}
}
function killEnemy(e,idx){
 score+=Math.floor(e.score*comboMult);kills++;comboKills++;comboTimer=4;
 if(comboKills%3===0)comboMult=clamp(comboMult+.25,1,4);
 if(comboKills%5===0){buffs.focus=2;snd(880,.12,"triangle",.1)}
 addFloat("+"+Math.floor(e.score*comboMult),e.mesh.position.clone().setY(2.4),0x75f4ff);
 burst(e.mesh.position.clone().setY(1.2),e.type==="boss"?0xffd25c:0xff4158,e.type==="boss"?80:18,e.type==="boss"?1.5:1);
 if(e.type==="boss"){score+=1000;slowMo=.18;for(var j=enemies.length-1;j>=0;j--)if(enemies[j]!==e)killEnemy(enemies[j],j);scene.remove(e.mesh);enemies.splice(idx,1);gameOver(true);return}
 if(Math.random()<dropChance())spawnPickup(randomPickup(),e.mesh.position.clone());
 scene.remove(e.mesh);enemies.splice(idx,1);snd(180+rnd(0,120),.12,"sawtooth",.08);
}
function dropChance(){return wave<3?.33:wave<6?.22:.14}
function randomPickup(){var r=Math.random();if(r<.25)return"med";if(r<.45)return"ammo";if(r<.58)return"armor";if(r<.68&&weaponLv<3)return"kit";if(r<.8)return"pierce";if(r<.9)return"adrenaline";return"cache"}
function spawnPickup(type,pos){
 var color={med:0x45ff86,armor:0x5ca8ff,ammo:0xffd33f,kit:0xb35cff,adrenaline:0xff4a4a,pierce:0xd9e7ef,drone:0x63f6ff,cache:0xffd65a}[type]||ACCENT;
 var geo=type==="kit"?new T.BoxGeometry(.75,.48,.5):type==="armor"?new T.CylinderGeometry(.45,.45,.18,6):new T.CylinderGeometry(.36,.36,.42,16);
 var mesh=new T.Mesh(geo,mat(color,color,.7));mesh.position.copy(pos);mesh.position.y=.35;scene.add(mesh);
 var ring=new T.Mesh(new T.TorusGeometry(.62,.035,8,32),new T.MeshBasicMaterial({color:color,transparent:true,opacity:.75,blending:T.AdditiveBlending}));ring.rotation.x=Math.PI/2;mesh.add(ring);
 pickups.push({type:type,mesh:mesh,color:color,life:22});
}
function collectPickup(p,idx){
 if(p.type==="med")hp=clamp(hp+35,0,MAX_HP);
 if(p.type==="armor")armor=clamp(armor+40,0,40);
 if(p.type==="ammo"){ammo=WEAPONS[weaponLv].mag;buffs.ammo=4}
 if(p.type==="kit"){if(weaponLv<3)weaponLv++;score+=250;slowMo=.18;showBanner("WEAPON UPGRADE · "+WEAPONS[weaponLv].name)}
 if(p.type==="adrenaline")buffs.adrenaline=7;
 if(p.type==="pierce")buffs.pierce=10;
 if(p.type==="drone")buffs.drone=12;
 if(p.type==="cache"){score+=500;comboProtect=8}
 score+=50;burst(player.position.clone().setY(.35),p.color,22,1);snd(720,.12,"triangle",.1);scene.remove(p.mesh);pickups.splice(idx,1);
}

/* ---------- update ---------- */
function update(dt){
 dt=Math.min(dt,.033);if(slowMo>0){slowMo-=dt;dt*=.45}
 elapsed+=dt;fireCd=Math.max(0,fireCd-dt);dashCd=Math.max(0,dashCd-dt);invuln=Math.max(0,invuln-dt);shake=Math.max(0,shake-dt*1.8);
 for(var k in buffs)buffs[k]=Math.max(0,buffs[k]-dt);comboProtect=Math.max(0,comboProtect-dt);
 if(comboTimer>0){comboTimer-=dt;if(comboTimer<=0){comboKills=0;comboMult=1}}
 updateAim();movePlayer(dt);if((mouse.down||key.Space)&&state==="play")shoot();if(reloadT>0){reloadT-=dt;if(reloadT<=0)ammo=WEAPONS[weaponLv].mag}
 if(!waveActive){nextWaveTimer-=dt;if(nextWaveTimer<=0)spawnWave()}
 updateBullets(dt);updateEnemies(dt);updatePickups(dt);updateParticles(dt);updateGrenades(dt);updateCamera(dt);updateHud();
 if(waveActive&&enemies.length===0&&wave<WAVE_DEFS.length){score+=WAVE_DEFS[wave].bonus;showBanner("WAVE CLEAR +" + WAVE_DEFS[wave].bonus);spawnPickup(Math.random()<.4?"med":(weaponLv<3&&Math.random()<.5?"kit":"ammo"),new T.Vector3(rnd(-5,5),0,rnd(-4,6)));wave++;waveActive=false;nextWaveTimer=wave<WAVE_DEFS.length?WAVE_DEFS[wave].delay:9999}
}
function updateAim(){
 var rect=renderer.domElement.getBoundingClientRect(),mx=(mouse.x/rect.width)*2-1,my=-(mouse.y/rect.height)*2+1;
 raycaster.setFromCamera(new T.Vector2(mx,my),camera);raycaster.ray.intersectPlane(groundPlane,aimPoint);
 lookXZ(player,aimPoint);playerBody.rotation.y=0;rifle.rotation.y=0;
 var sc=worldToScreen(aimPoint);var r=el("reticle");r.style.left=sc.x+"px";r.style.top=sc.y+"px";
}
function movePlayer(dt){
 var ix=(key.KeyD||key.ArrowRight?1:0)-(key.KeyA||key.ArrowLeft?1:0),iz=(key.KeyS||key.ArrowDown?1:0)-(key.KeyW||key.ArrowUp?1:0);
 var v=new T.Vector3(ix,0,iz);if(v.lengthSq()>0)v.normalize();
 if(key.ShiftLeft&&dashCd<=0&&v.lengthSq()>0){dashT=.18;dashCd=4.8;invuln=.22;burst(player.position.clone().setY(.25),ACCENT,16,1);snd(450,.08,"triangle",.09)}
 var sp=(reloadT>0?3.8:6.2)*(buffs.adrenaline>0?1.25:1);if(dashT>0){sp=18;dashT-=dt;footRing.material.opacity=1}else footRing.material.opacity=.72;
 var old=player.position.clone();player.position.add(v.multiplyScalar(sp*dt));player.position.x=clamp(player.position.x,-ARENA.x+1,ARENA.x-1);player.position.z=clamp(player.position.z,-ARENA.z+1,ARENA.z-1);
 for(var i=0;i<obstacles.length;i++)if(obstacles[i].solid&&rectHit(player.position,obstacles[i],.58)){player.position.copy(old);break}
 footRing.rotation.z+=dt*4;
}
function rectHit(pos,o,r){return Math.abs(pos.x-o.x)<o.w/2+r&&Math.abs(pos.z-o.z)<o.d/2+r}
function lineBlocked(a,b){
 for(var i=0;i<obstacles.length;i++){var o=obstacles[i];if(!o.mesh.visible)continue;var steps=8;for(var s=1;s<=steps;s++){var p=a.clone().lerp(b,s/steps);if(rectHit(p,o,.08))return o}}return null
}
function updateBullets(dt){
 for(var i=bullets.length-1;i>=0;i--){var b=bullets[i],old=b.m.position.clone();b.m.position.add(b.dir.clone().multiplyScalar(b.spd*dt));b.life-=dt;
  var hitObs=lineBlocked(old,b.m.position);if(hitObs){damageObstacle(hitObs,b.dmg,b.m.position);removeObj(bullets,i);continue}
  var hit=false;
  for(var j=enemies.length-1;j>=0;j--){var e=enemies[j];if(dist2(b.m.position,e.mesh.position)<(e.type==="boss"?1.8:.75)){
    var dmg=b.dmg;if(e.type==="shield"){var front=new T.Vector3(Math.sin(e.mesh.rotation.y),0,Math.cos(e.mesh.rotation.y));var incoming=b.dir.clone().negate();if(front.dot(incoming)> .45)dmg*=buffs.pierce>0?.55:.2}
    if(e.type==="boss"&&e.hp/e.max<.7&&Math.abs(Math.sin(e.mesh.rotation.y)*b.dir.z-Math.cos(e.mesh.rotation.y)*b.dir.x)<.5)dmg*=.55;
    e.hp-=dmg;if(e.aim>0)e.hitDuringAim+=dmg;burst(b.m.position,0xffd36c,5,.55);
    if(e.hp<=0){killEnemy(e,j);j--}
    if(b.pierce>0)b.pierce--;else{hit=true;break}
  }}
  if(hit||b.life<=0||Math.abs(b.m.position.x)>42||Math.abs(b.m.position.z)>30)removeObj(bullets,i)
 }
 for(var q=enemyBullets.length-1;q>=0;q--){var eb=enemyBullets[q],old2=eb.m.position.clone();eb.m.position.add(eb.dir.clone().multiplyScalar(eb.spd*dt));eb.life-=dt;
  if(lineBlocked(old2,eb.m.position)){burst(eb.m.position,0xffbd5a,4,.6);removeObj(enemyBullets,q);continue}
  if(dist2(eb.m.position,player.position)<.62){damagePlayer(eb.dmg);removeObj(enemyBullets,q);continue}
  if(eb.life<=0)removeObj(enemyBullets,q)
 }
}
function damageObstacle(o,dmg,pos){
 if(o.hp>=9999)return;o.hp-=dmg;burst(pos,o.type==="sand"?0xcaa56b:0x9aa0a8,6,.6);
 if(o.type==="sand"&&o.hp<o.max*.5)o.mesh.scale.y=.58;
 if(o.type==="car"&&o.hp<80&&o.fire<=0&&!o.exploded){o.fire=3;showBanner("CAR FIRE · CLEAR OUT")}
 if(o.hp<=0){if(o.type==="crate"&&Math.random()<.12)spawnPickup(randomPickup(),new T.Vector3(o.x,0,o.z));if(o.type==="car")explodeCar(o);o.mesh.visible=false;o.solid=false;burst(new T.Vector3(o.x,1,o.z),0xff7d34,28,1.1);shake=Math.max(shake,.35)}
}
function explodeCar(o){o.exploded=true;snd(80,.5,"sawtooth",.2);for(var i=enemies.length-1;i>=0;i--)if(dist2(new T.Vector3(o.x,0,o.z),enemies[i].mesh.position)<5){enemies[i].hp-=80;if(enemies[i].hp<=0)killEnemy(enemies[i],i)}if(dist2(new T.Vector3(o.x,0,o.z),player.position)<5)damagePlayer(80);shake=.7}
function removeObj(arr,i){if(arr[i].m)scene.remove(arr[i].m);arr.splice(i,1)}
function updateEnemies(dt){
 for(var i=enemies.length-1;i>=0;i--){var e=enemies[i],spec=TYPES[e.type],pos=e.mesh.position,to=new T.Vector3(player.position.x-pos.x,0,player.position.z-pos.z),d=to.length();if(d>.01)to.normalize();lookXZ(e.mesh,player.position);
  if(e.aim>0){e.aim-=dt;drawLaser(e);if(e.aim<=0&&e.hitDuringAim<25){spawnEnemyBullet(pos,to,0,38,42,0xff3148);e.fire=spec.fire}else e.fire=1.2;continue}
  var desired=spec.range;if(e.type==="runner")desired=1.4;if(e.type==="boss")desired=e.hp/e.max<.35?11:16;
  var move=new T.Vector3();if(d>desired)move.copy(to);else if(d<desired-2)move.copy(to).multiplyScalar(-1);
  move.x+=Math.sin(elapsed*1.7+i)*.28;move.z+=Math.cos(elapsed*1.3+i)*.28;if(move.lengthSq()>0)move.normalize();
  var old=pos.clone();pos.add(move.multiplyScalar(spec.spd*(1+wave*.025)*dt));pos.x=clamp(pos.x,-ARENA.x+1,ARENA.x-1);pos.z=clamp(pos.z,-ARENA.z+1,ARENA.z-1);
  for(var o=0;o<obstacles.length;o++)if(obstacles[o].solid&&rectHit(pos,obstacles[o],e.type==="boss"?1.3:.55)){pos.copy(old);break}
  e.fire-=dt;if(e.fire<=0&&d<spec.range+3&&!lineBlocked(pos.clone().setY(1),player.position.clone().setY(1)))enemyShoot(e);
  if(e.melee>0)e.melee-=dt;
  if(e.type==="boss"){var tor=e.mesh.children[e.mesh.children.length-1];if(tor)tor.rotation.z+=dt*2;if(e.hp/e.max<.35)scene.fog.color.setHex(0x3b2024)}
 }
}
function drawLaser(e){var a=e.mesh.position.clone().setY(1.35),b=player.position.clone().setY(1.1);tracer(a,b,0xff1830)}
function updatePickups(dt){
 for(var i=pickups.length-1;i>=0;i--){var p=pickups[i];p.life-=dt;p.mesh.rotation.y+=dt*2.4;p.mesh.position.y=.35+Math.sin(elapsed*4+i)*.08;if(dist2(p.mesh.position,player.position)<2.2&&(key.KeyE||mouse.down))collectPickup(p,i);else if(p.life<=0){scene.remove(p.mesh);pickups.splice(i,1)}}
}
function updateGrenades(dt){
 for(var i=grenades.length-1;i>=0;i--){var g=grenades[i];g.t-=dt;g.mesh.scale.setScalar(1+(1.2-g.t)*.35);g.mesh.material.opacity=.25+Math.sin(elapsed*30)*.45;if(g.t<=0){burst(g.pos.clone().setY(.3),0xff5430,34,1.1);shake=Math.max(shake,.45);snd(90,.35,"sawtooth",.18);if(dist2(g.pos,player.position)<g.r)damagePlayer(g.dmg);scene.remove(g.mesh);grenades.splice(i,1)}}
}
function updateParticles(dt){
 for(var i=particles.length-1;i>=0;i--){var p=particles[i];p.life-=dt;if(!p.line){p.m.position.add(p.v.clone().multiplyScalar(dt));p.v.y-=5*dt;p.m.rotation.x+=p.spin*dt;p.m.rotation.y+=p.spin*.7*dt;p.m.material.opacity=clamp(p.life/p.max,0,1);p.m.scale.setScalar(clamp(p.life/p.max,0,1))}else p.m.material.opacity=clamp(p.life/p.max,0,1);if(p.life<=0){scene.remove(p.m);particles.splice(i,1)}}
 for(var f=floaters.length-1;f>=0;f--){var fl=floaters[f];fl.life-=dt;fl.pos.y+=dt*1.8;var s=worldToScreen(fl.pos);fl.el.style.left=s.x+"px";fl.el.style.top=s.y+"px";fl.el.style.opacity=fl.life;if(fl.life<=0){fl.el.remove();floaters.splice(f,1)}}
 for(var o=0;o<obstacles.length;o++)if(obstacles[o].type==="car"&&obstacles[o].fire>0){obstacles[o].fire-=dt;burst(new T.Vector3(obstacles[o].x,1.2,obstacles[o].z),0xff5b20,1,.7);if(obstacles[o].fire<=0&&!obstacles[o].exploded)explodeCar(obstacles[o])}
}
function updateCamera(dt){
 var target=new T.Vector3(player.position.x,0,player.position.z+6),desired=new T.Vector3(player.position.x,26,player.position.z+24);
 if(shake>0){desired.x+=rnd(-shake,shake)*1.8;desired.y+=rnd(-shake,shake)*1.2;desired.z+=rnd(-shake,shake)*1.8}
 camera.position.lerp(desired,1-Math.pow(.001,dt));camera.lookAt(target);
}

/* ---------- input/loop ---------- */
function bindInput(){
 addEventListener("keydown",function(e){key[e.code]=true;if(e.code==="Space"){e.preventDefault();if(state!=="play")startGame();else shoot()}if(e.code==="KeyR")reload();});
 addEventListener("keyup",function(e){key[e.code]=false});
 addEventListener("mousemove",function(e){mouse.x=e.clientX;mouse.y=e.clientY});
 addEventListener("mousedown",function(e){mouse.down=true;mouse.x=e.clientX;mouse.y=e.clientY;if(state!=="play")startGame();else shoot()});
 addEventListener("mouseup",function(){mouse.down=false});
 el("startBtn").addEventListener("click",startGame);el("restartBtn").addEventListener("click",startGame);
}
function onResize(){camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)}
function loop(){requestAnimationFrame(loop);var dt=clock.getDelta();if(state==="play")update(dt);else updateCamera(Math.min(dt,.033));renderer.render(scene,camera)}
init();
})();
</script>
</body>
</html>
